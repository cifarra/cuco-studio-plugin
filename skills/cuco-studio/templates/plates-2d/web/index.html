<!doctype html>
<html><head><meta charset="utf-8"><title>plates</title>
<!-- default faces (style 65 "Cuco"); a style's own fonts load from theme.json -->
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet">
<style>html,body{margin:0;overflow:hidden}#stage{position:relative}</style>
</head><body>
<svg width="0" height="0" style="position:absolute">
  <!-- screenprint edge wobble for the color pass (cuco-brand-design "mottle", minus the speck: specks are punched separately).
       scale is set from theme.json print.wobble -->
  <filter id="wob" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.015" numOctaves="2" seed="7" result="warp"/>
    <feDisplacementMap in="SourceGraphic" in2="warp" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="stage"></div>
<script type="module" src="./js/engine.js"></script>
</body></html>
